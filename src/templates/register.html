<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 工业缺陷智能检测系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo"><i class="bi bi-person-plus-fill"></i></div>
            <h3 class="auth-title">用户注册</h3>
            <form id="register-form">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-person me-1"></i>用户名</label>
                    <input type="text" class="form-control" id="username" required placeholder="3-50个字符" minlength="3" maxlength="50">
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-lock me-1"></i>密码</label>
                    <input type="password" class="form-control" id="password" required placeholder="至少6位" minlength="6">
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-lock-fill me-1"></i>确认密码</label>
                    <input type="password" class="form-control" id="confirm_password" required placeholder="再次输入密码" minlength="6">
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">注 册</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <span class="text-muted">已有账号？</span>
                <a href="/login" class="text-decoration-none">立即登录</a>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            if (password !== confirm_password) {
                showToast('两次输入的密码不一致', 'error');
                return;
            }

            showLoading('注册中...');
            try {
                await axios.post('/api/auth/register', { username, password, confirm_password });
                showToast('注册成功，请登录');
                setTimeout(() => window.location.href = '/login', 1000);
            } catch (error) {
                const msg = error.response?.data?.error || '注册失败';
                showToast(msg, 'error');
            } finally {
                hideLoading();
            }
        });
    </script>
</body>
</html>
