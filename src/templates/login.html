<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 工业缺陷智能检测系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo"><i class="bi bi-cpu-fill"></i></div>
            <h3 class="auth-title">工业缺陷智能检测系统</h3>
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-person me-1"></i>用户名</label>
                    <input type="text" class="form-control" id="username" required placeholder="请输入用户名" autocomplete="username">
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-lock me-1"></i>密码</label>
                    <input type="password" class="form-control" id="password" required placeholder="请输入密码" autocomplete="current-password">
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">登 录</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <span class="text-muted">还没有账号？</span>
                <a href="/register" class="text-decoration-none">立即注册</a>
            </div>
            <div class="text-center mt-2">
                <small class="text-muted">默认管理员: admin / admin123</small>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            showLoading('登录中...');
            try {
                await axios.post('/api/auth/login', { username, password });
                showToast('登录成功');
                setTimeout(() => window.location.href = '/', 500);
            } catch (error) {
                const msg = error.response?.data?.error || '登录失败';
                showToast(msg, 'error');
            } finally {
                hideLoading();
            }
        });
    </script>
</body>
</html>
